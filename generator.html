<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد بطاقات كنز السلف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; direction: rtl; }
        .box { background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #1e3d2f; text-align: center; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #333; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
        button { width: 100%; padding: 12px; background: #1e3d2f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
        button:hover { background: #2c5e43; }
        textarea.result { background: #f0f0f0; font-family: monospace; font-size: 13px; margin-top: 10px; }
        .hint { font-size: 12px; color: #666; margin-top: 5px; font-style: italic; }
        .search-input { border: 1.5px solid #1e3d2f; background-color: #fafafa; }
    </style>
</head>
<body>

<div class="box">
    <h2>🛠️ صانع كود البطاقات لـ كنز السلف</h2>
    <p style="text-align:center; font-size:13px; color:#666; margin-bottom:20px;">اكتب النص بيدك هنا ليصنع لك الكود تلقائياً</p>

    <!-- 1️⃣ المربع الحر العلوي (مثل محرك البحث) لتكتب فيه أي اسم أو عنوان يدوي بحرية كاملة -->
    <label style="color: #1e3d2f;">✍️ اكتب هنا يدوياً (اسم المقال أو أي عنوان مخصص تريده):</label>
    <input type="text" id="manual-title" class="search-input" placeholder="اكتب هنا بيدك بحرية دون قيود...">

    <!-- 2️⃣ قائمة درجة التوثيق الرسمية -->
    <label>📋 درجة توثيق النص الأثرية:</label>
    <select id="trust-status">
        <option value="ثابت / صحيح" selected>🟢 ثابت / صحيح</option>
        <option value="ضعيف / فيه مقال">🟡 ضعيف / فيه مقال</option>
        <option value="لم يثبت / مكذوب">🔴 لم يثبت / مكذوب</option>
    </select>

    <!-- 3️⃣ قائمة نوع المحتوى المحدثة بالكامل والمعدلة حسب طلبك الدقيق -->
    <label>📚 نوع المحتوى والبطاقة الإشارية:</label>
    <select id="content-type">
        <option value="موعظة" selected>🟤 موعظة</option>
        <option value="أثر">🔵 أثر</option>
        <option value="بيت شعر أو قصيدة">🟣 بيت شعر أو قصيدة شعرية</option>
        <option value="آية قرآنية">⚪ آية قرآنية كريمة</option>
        <option value="حديث شريف">⚫ حديث نبوي شريف</option>
    </select>

    <!-- 4️⃣ الحقول الأساسية للنص والبيانات -->
    <label>📝 نص الآية، الحديث أو الموعظة (بالتشكيل):</label>
    <textarea id="text" rows="4" placeholder="أدخل النص هنا بالهمزات الصحيحة..."></textarea>

    <label>👤 الراوي أو القائل أو المفسر:</label>
    <input type="text" id="author" placeholder="مثال: عمر بن الخطاب رضي الله عنه">

    <label>📖 المصدر أو المخرج العلمي أو ديوان الشعر:</label>
    <input type="text" id="source" placeholder="مثال: صحيح البخاري / ديوان حسان">

    <label>💡 الشرح والبيان والتحليل التربوي:</label>
    <textarea id="explain" rows="3" placeholder="اكتب الشرح المبسط والواضح هنا ليفهمه الزوار..."></textarea>

    <!-- زر التوليد السحري -->
    <button onclick="generateCode()">صناعة الكود الجاهز ✨</button>

    <!-- مخرجات الكود للنسخ -->
    <label style="margin-top:20px; color:#c0392b;">👇 اضغط داخل المربع بالأسفل وانسخ الكود الناتج:</label>
    <textarea id="output" class="result" readonly placeholder="سيظهر الكود البرمجي هنا بعد ضغط زر صناعة الكود..."></textarea>
    <p class="hint">ملاحظة: هذا الكود تأخذه وتلصقه في أسفل قسم الأحاديث أو المواعظ مباشرة فوق زر العودة.</p>
</div>

<script>
function generateCode() {
    // جلب البيانات من كافة الحقول
    const manualTitle = document.getElementById('manual-title').value.trim();
    const trustStatus = document.getElementById('trust-status').value;
    const contentType = document.getElementById('content-type').value;
    const text = document.getElementById('text').value.trim();
    const author = document.getElementById('author').value.trim();
    const source = document.getElementById('source').value.trim();
    const explain = document.getElementById('explain').value.trim();

    // اختيار رمز الدائرة لنوع المحتوى بالتدريج والتعديل الجديد
    let contentCircle = "🟤";
    if (contentType === "أثر") contentCircle = "🔵";
    if (contentType === "بيت شعر أو قصيدة") contentCircle = "🟣";
    if (contentType === "آية قرآنية") contentCircle = "⚪";
    if (contentType === "حديث شريف") contentCircle = "⚫";

    // اختيار رمز الدائرة لدرجة التوثيق
    let trustCircle = "🟢";
    if (trustStatus.includes("ضعيف")) trustCircle = "🟡";
    if (trustStatus.includes("لم يثبت")) trustCircle = "🔴";

    // طبخ وتجهيز النص النهائي الذي سيظهر في الكود
    let finalClassification = `${contentCircle} ${contentType} | ${trustCircle} ${trustStatus}`;
    
    // دمج المدخل اليدوي من مربع البحث العلوي إن وجد بحرية كاملة
    if (manualTitle !== "") {
        finalClassification = `✏️ عنوان مخصص: ${manualTitle} | ${finalClassification}`;
    }

    // قالب بطاقة الـ HTML النهائي الصافي والمنظم المتوافق مع موقعك
    const finalHTMLResult = `<!-- بداية بطاقة كنز السلف المطبوخة -->
<div class="salaf-card" style="border: 1px solid #1e3d2f; padding: 18px; margin: 12px 0; border-radius: 8px; font-family: sans-serif; direction: rtl; text-align: right; background-color: #fff;">
    <div style="font-weight: bold; margin-bottom: 10px; color: #333; font-size: 14px;">${finalClassification}</div>
    <blockquote style="font-size: 16px; color: #1e3d2f; margin: 12px 0; font-weight: 500; line-height: 1.6;">"${text}"</blockquote>
    <div style="font-size: 13px; color: #555; margin-bottom: 4px;"><b>القائل/الراوي:</b> ${author}</div>
    <div style="font-size: 13px; color: #555; margin-bottom: 8px;"><b>المصدر:</b> ${source}</div>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
    <div style="font-size: 13px; color: #666; font-style: italic; line-height: 1.5;"><b>الشرح التربوي:</b> ${explain}</div>
</div>
<!-- نهاية بطاقة كنز السلف المطبوخة -->`;

    // ضخ النتيجة النهائية داخل صندوق المخرجات
    document.getElementById('output').value = finalHTMLResult;
}
</script>

</body>
</html>
