<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد بطاقات كنز السلف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; direction: rtl; }
        .box { background: white; padding: 20px; max-width: 500px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: #1e3d2f; text-align: center; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; color: #333; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #fff; }
        button { width: 100%; padding: 12px; background: #1e3d2f; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; }
        button:hover { background: #2c5e43; }
        textarea.result { background: #f0f0f0; font-family: monospace; font-size: 13px; margin-top: 10px; }
        .hint { font-size: 12px; color: #666; margin-top: 5px; font-style: italic; }
        .search-input { border: 1.5px solid #1e3d2f; background-color: #fafafa; }
    </style>
</head>
<body>

<div class="box">
    <h2>🛠️ صانع كود البطاقات لـ كنز السلف</h2>
    <p style="text-align:center; font-size:13px; color:#666; margin-bottom:20px;">اكتب النص بيدك هنا ليصنع لك الكود تلقائياً</p>

    <!-- 1️⃣ المربع الحر العلوي -->
    <label style="color: #1e3d2f;">✍️ اكتب هنا يدوياً (اكتب أي عنوان أو أيقونة بيدك هنا):</label>
    <input type="text" id="manual-title" class="search-input" placeholder="مثال: 📜 مواعظ للبنعلي">

    <!-- 2️⃣ قائمة درجة التوثيق (مع إضافة خيار فارغ) -->
    <label>📋 درجة توثيق النص الأثرية واللون:</label>
    <select id="trust-status">
        <option value="ثابت / صحيح" selected>🟢 ثابت / صحيح - (أخضر)</option>
        <option value="ضعيف / فيه مقال">🟡 ضعيف / فيه مقال - (أصفر)</option>
        <option value="لم يثبت / مكذوب">🔴 لم يثبت / مكذوب - (أحمر)</option>
        <option value="empty">⚪ خيار فارغ (لا يظهر شيء)</option>
    </select>

    <!-- 3️⃣ قائمة نوع المحتوى (مع إضافة خيار فارغ) -->
    <label>📚 نوع المحتوى والالبطاقة الإشارية:</label>
    <select id="content-type">
        <option value="موعظة" selected>🟤 موعظة</option>
        <option value="أثر">🔵 أثر</option>
        <option value="بيت شعر أو قصيدة">🟣 بيت شعر أو قصيدة شعرية</option>
        <option value="آية قرآنية">⚪ آية قرآنية كريمة</option>
        <option value="حديث شريف">⚫ حديث نبوي شريف</option>
        <option value="empty">⚪ خيار فارغ (لا يظهر شيء)</option>
    </select>

    <!-- 4️⃣ الحقول الأساسية للبيانات -->
    <label>📝 نص الآية، الحديث أو الموعظة (بالتشكيل):</label>
    <textarea id="text" rows="4" placeholder="أدخل النص هنا بالهمزات الصحيحة..."></textarea>

    <label>👤 الراوي أو القائل أو المفسر:</label>
    <input type="text" id="author" placeholder="مثال: عمر بن الخطاب رضي الله عنه">

    <label>📖 المصدر أو المخرج العلمي أو ديوان الشعر:</label>
    <input type="text" id="source" placeholder="مثال: صحيح البخاري / ديوان حسان">

    <label>💡 الشرح والبيان والتحليل التربوي:</label>
    <textarea id="explain" rows="3" placeholder="اكتب الشرح المبسط والواضح هنا ليفهمه الزوار..."></textarea>

    <!-- زر التوليد الذكي -->
    <button onclick="generateCode()">صناعة الكود الجاهز ✨</button>

    <!-- مخرجات الكود للنسخ -->
    <label style="margin-top:20px; color:#c0392b;">👇 اضغط داخل المربع بالأسفل وانسخ الكود الناتج:</label>
    <textarea id="output" class="result" readonly placeholder="سيظهر الكود البرمجي هنا بعد ضغط زر صناعة الكود..."></textarea>
    <p class="hint">ملاحظة: هذا الكود تأخذه وتلصقه في أسفل قسم الأحاديث أو المواعظ مباشرة فوق زر العودة.</p>
</div>

<script>
function generateCode() {
    // جلب قيم المدخلات
    const manualTitle = document.getElementById('manual-title').value.trim();
    const trustStatus = document.getElementById('trust-status').value;
    const contentType = document.getElementById('content-type').value;
    const text = document.getElementById('text').value.trim();
    const author = document.getElementById('author').value.trim();
    const source = document.getElementById('source').value.trim();
    const explain = document.getElementById('explain').value.trim();

    // إعداد ألوان البطاقة والصندوق بناءً على اختيارك التلقائي داير ما يدورها
    let mainColor = "#1e3d2f";   // أخضر افتراضي
    let headerBg = "#1e3d2f";    // خلفية العنوان تطابق لون الاختيار تماماً
    
    let trustCircle = "🟢";
    let contentCircle = "🟤";

    // تغيير الألوان داير مدارها حسب درجة التوثيق ليتطابق الصندوق مع الإطار
    if (trustStatus.includes("ضعيف")) {
        mainColor = "#f39c12";   // أصفر
        headerBg = "#f39c12";
        trustCircle = "🟡";
    } else if (trustStatus.includes("لم يثبت")) {
        mainColor = "#c0392b";   // أحمر
        headerBg = "#c0392b";
        trustCircle = "🔴";
    }

    // إعداد رموز تصنيف المحتوى
    if (contentType === "أثر") contentCircle = "🔵";
    if (contentType === "بيت شعر أو قصيدة") contentCircle = "🟣";
    if (contentType === "آية قرآنية") contentCircle = "⚪";
    if (contentType === "حديث شريف") contentCircle = "⚫";

    // بناء سطر التصنيف بذكاء (لو أحدهما فارغ أو كلاهما فارغ لا يظهران)
    let classificationHeader = "";
    if (contentType !== "empty" && trustStatus !== "empty") {
        classificationHeader = `<div style="font-size: 12px; color: #777; margin-bottom: 12px; border-bottom: 1px dashed #eee; padding-bottom: 6px;">${contentCircle} التصنيف: ${contentType} &nbsp;|&nbsp; ${trustCircle} التوثيق: ${trustStatus}</div>`;
    } else if (contentType !== "empty") {
        classificationHeader = `<div style="font-size: 12px; color: #777; margin-bottom: 12px; border-bottom: 1px dashed #eee; padding-bottom: 6px;">${contentCircle} التصنيف: ${contentType}</div>`;
    } else if (trustStatus !== "empty") {
        classificationHeader = `<div style="font-size: 12px; color: #777; margin-bottom: 12px; border-bottom: 1px dashed #eee; padding-bottom: 6px;">${trustCircle} التوثيق: ${trustStatus}</div>`;
    }

    // صياغة عنوان الصندوق (تم إزالة الإيموجي البرمجي 📜 لكي تعتمد فقط على ما تكتبه أنت بيدك)
    let cardTitle = manualTitle !== "" ? manualTitle : `من ${contentType} السلف`;

    // طبخ كود الـ HTML المتناسق والخالي من التكرار والزيادات
    const finalHTMLResult = `<!-- بداية بطاقة كنز السلف المطبوخة والمحدثة بالكامل -->
<div class="salaf-card" style="border: 2px solid ${mainColor}; padding: 20px; margin: 15px 0; border-radius: 12px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; text-align: right; background-color: #fff; position: relative;">
    
    <!-- الصندوق العلوي يطابق لون اختيارك داير مدارها وبدون تكرار أيقونات من عندي -->
    <div style="display: inline-block; background-color: ${headerBg}; color: white; padding: 6px 16px; border-radius: 6px; font-weight: bold; font-size: 14px; margin-bottom: 15px;">
        ${cardTitle}
    </div>

    <!-- السطر الإشاري المخفي تلقائياً عند اختيار الخيارات الفارغة -->
    ${classificationHeader}

    <!-- متن النص الأساسي -->
    <div style="font-size: 19px; color: #2c3e50; font-weight: bold; line-height: 1.8; margin: 15px 0; text-align: center; padding: 0 10px;">
        "${text}"
    </div>

    <!-- بيانات القائل والمصدر منسقة على شكل نقاط داخل إطار ملون متناسق -->
    <div style="background-color: #fafafa; padding: 12px; border-radius: 6px; margin-top: 15px; border-right: 3px solid ${mainColor};">
        <ul style="list-style-type: square; margin: 0; padding-right: 20px; font-size: 14px; color: #333; line-height: 1.6;">
            <li><b>القائل:</b> ${author}</li>
            <li><b>المصدر:</b> ${source}</li>
        </ul>
    </div>

    <!-- الشرح التربوي -->
    <div style="margin-top: 15px; font-size: 14px; color: #555; line-height: 1.6; padding-top: 10px; border-top: 1px solid #eee;">
        ${explain}
    </div>

</div>
<!-- نهاية بطاقة كنز السلف المطبوخة والمحدثة بالكامل -->`;

    // ضخ الكود في صندوق المخرجات
    document.getElementById('output').value = finalHTMLResult;
}
</script>

</body>
</html>
